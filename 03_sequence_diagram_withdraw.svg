<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    Sequence Diagram - Withdraw Transaction
  </text>

  <!-- Lifelines -->
  <g font-size="13" font-weight="bold" fill="white">
    <rect x="30" y="60" width="120" height="36" rx="6" fill="#1a1a2e"/>
    <text x="90" y="83" text-anchor="middle">User</text>

    <rect x="220" y="60" width="120" height="36" rx="6" fill="#3a0ca3"/>
    <text x="280" y="83" text-anchor="middle">main.py</text>

    <rect x="410" y="60" width="160" height="36" rx="6" fill="#4361ee"/>
    <text x="490" y="83" text-anchor="middle" font-size="12">transaction_manager</text>

    <rect x="630" y="60" width="140" height="36" rx="6" fill="#4cc9f0"/>
    <text x="700" y="83" text-anchor="middle" fill="#0a2e3d">account_manager</text>
  </g>

  <!-- Lifeline verticals -->
  <line x1="90" y1="96" x2="90" y2="500" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="280" y1="96" x2="280" y2="500" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="490" y1="96" x2="490" y2="500" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="700" y1="96" x2="700" y2="500" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Messages -->
  <g font-size="12" fill="#222">
    <line x1="90" y1="130" x2="280" y2="130" stroke="#333" stroke-width="1.6" marker-end="url(#arrow3)"/>
    <text x="185" y="123" text-anchor="middle">1. selects "Withdraw", enters amount</text>

    <line x1="280" y1="170" x2="490" y2="170" stroke="#333" stroke-width="1.6" marker-end="url(#arrow3)"/>
    <text x="385" y="163" text-anchor="middle">2. withdraw(acc_no, amount)</text>

    <line x1="490" y1="210" x2="700" y2="210" stroke="#333" stroke-width="1.6" marker-end="url(#arrow3)"/>
    <text x="595" y="203" text-anchor="middle">3. get_account(acc_no)</text>

    <line x1="700" y1="245" x2="490" y2="245" stroke="#666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow3-thin)"/>
    <text x="595" y="238" text-anchor="middle">4. return account data</text>

    <text x="490" y="275" text-anchor="middle" font-size="11" font-style="italic" fill="#a4025c">
      [check: amount &lt;= limit AND balance - amount &gt;= min_balance]
    </text>

    <line x1="490" y1="305" x2="700" y2="305" stroke="#333" stroke-width="1.6" marker-end="url(#arrow3)"/>
    <text x="595" y="298" text-anchor="middle">5. update_balance(acc_no, new_balance)</text>

    <line x1="700" y1="335" x2="490" y2="335" stroke="#666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow3-thin)"/>
    <text x="595" y="328" text-anchor="middle">6. balance saved</text>

    <line x1="490" y1="365" x2="490" y2="365" stroke="#333" stroke-width="1.6"/>
    <text x="490" y="358" text-anchor="middle" font-size="11">7. log_transaction(acc_no, "WITHDRAW", amount, new_balance)</text>
    <rect x="470" y="368" width="40" height="20" fill="#f72585" opacity="0.15" stroke="#a4025c"/>
    <text x="490" y="382" text-anchor="middle" font-size="10" fill="#a4025c">self-call</text>

    <line x1="490" y1="410" x2="280" y2="410" stroke="#666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow3-thin)"/>
    <text x="385" y="403" text-anchor="middle">8. return new_balance</text>

    <line x1="280" y1="450" x2="90" y2="450" stroke="#666" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arrow3-thin)"/>
    <text x="185" y="443" text-anchor="middle">9. display "Withdrawal successful"</text>
  </g>

  <!-- Activation bars -->
  <rect x="85" y="130" width="10" height="330" fill="#1a1a2e" opacity="0.15"/>
  <rect x="275" y="170" width="10" height="250" fill="#3a0ca3" opacity="0.15"/>
  <rect x="485" y="210" width="10" height="165" fill="#4361ee" opacity="0.15"/>
  <rect x="695" y="210" width="10" height="130" fill="#4cc9f0" opacity="0.2"/>

  <defs>
    <marker id="arrow3" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
    <marker id="arrow3-thin" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
