<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    BankSim - System Architecture
  </text>

  <!-- User -->
  <rect x="380" y="70" width="140" height="50" rx="8" fill="#4361ee" stroke="#2c3e91" stroke-width="2"/>
  <text x="450" y="100" text-anchor="middle" font-size="15" fill="white" font-weight="bold">User (Console)</text>

  <!-- Arrow down to main.py -->
  <line x1="450" y1="120" x2="450" y2="160" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- main.py -->
  <rect x="340" y="165" width="220" height="55" rx="8" fill="#3a0ca3" stroke="#240a63" stroke-width="2"/>
  <text x="450" y="188" text-anchor="middle" font-size="15" fill="white" font-weight="bold">main.py</text>
  <text x="450" y="207" text-anchor="middle" font-size="11" fill="#e0d9f7">Menu-driven controller</text>

  <!-- Three module boxes -->
  <line x1="450" y1="220" x2="180" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="450" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="450" y1="220" x2="720" y2="270" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="60" y="275" width="240" height="70" rx="8" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
  <text x="180" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a2e3d">account_manager.py</text>
  <text x="180" y="318" text-anchor="middle" font-size="11" fill="#0a2e3d">Module 1: Account</text>
  <text x="180" y="332" text-anchor="middle" font-size="11" fill="#0a2e3d">Management</text>

  <rect x="330" y="275" width="240" height="70" rx="8" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
  <text x="450" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a2e3d">transaction_manager.py</text>
  <text x="450" y="318" text-anchor="middle" font-size="11" fill="#0a2e3d">Module 2: Deposit,</text>
  <text x="450" y="332" text-anchor="middle" font-size="11" fill="#0a2e3d">Withdraw, Transfer, Interest</text>

  <rect x="600" y="275" width="240" height="70" rx="8" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
  <text x="720" y="300" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a2e3d">history_manager.py</text>
  <text x="720" y="318" text-anchor="middle" font-size="11" fill="#0a2e3d">Module 3: Logging</text>
  <text x="720" y="332" text-anchor="middle" font-size="11" fill="#0a2e3d">&amp; Reporting</text>

  <!-- transaction_manager calls account_manager -->
  <line x1="450" y1="275" x2="280" y2="300" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-thin)"/>
  <text x="360" y="270" font-size="10" fill="#555">uses</text>

  <!-- transaction_manager calls history_manager -->
  <line x1="570" y1="300" x2="600" y2="300" stroke="#666" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow-thin)"/>
  <text x="573" y="292" font-size="10" fill="#555">logs to</text>

  <!-- utils.py shared -->
  <rect x="380" y="400" width="140" height="45" rx="8" fill="#f72585" stroke="#a4025c" stroke-width="2"/>
  <text x="450" y="428" text-anchor="middle" font-size="13" fill="white" font-weight="bold">utils.py</text>

  <line x1="180" y1="345" x2="420" y2="405" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="450" y1="345" x2="450" y2="400" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="720" y1="345" x2="480" y2="405" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="450" y="465" text-anchor="middle" font-size="11" fill="#777">shared input validation used by all modules</text>

  <!-- Data storage -->
  <line x1="180" y1="345" x2="180" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="720" y1="345" x2="720" y2="480" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="80" y="485" width="200" height="55" rx="6" fill="#ffd166" stroke="#a87f00" stroke-width="2"/>
  <text x="180" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d3800">data/accounts.csv</text>
  <text x="180" y="524" text-anchor="middle" font-size="10" fill="#4d3800">Persistent account records</text>

  <rect x="620" y="485" width="200" height="55" rx="6" fill="#ffd166" stroke="#a87f00" stroke-width="2"/>
  <text x="720" y="508" text-anchor="middle" font-size="13" font-weight="bold" fill="#4d3800">data/transactions.csv</text>
  <text x="720" y="524" text-anchor="middle" font-size="10" fill="#4d3800">Persistent transaction log</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#333"/>
    </marker>
    <marker id="arrow-thin" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#666"/>
    </marker>
  </defs>
</svg>
