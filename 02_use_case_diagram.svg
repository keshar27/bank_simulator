<svg viewBox="0 0 900 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="620" fill="#ffffff"/>
  <text x="450" y="35" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a2e">
    BankSim - Use Case Diagram
  </text>

  <!-- System boundary -->
  <rect x="230" y="65" width="500" height="500" rx="10" fill="#f7f9fc" stroke="#3a0ca3" stroke-width="2"/>
  <text x="480" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#3a0ca3">BankSim System</text>

  <!-- Actor: Customer -->
  <g transform="translate(60,300)">
    <circle cx="0" cy="-40" r="14" fill="none" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="0" y1="-26" x2="0" y2="10" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="-18" y1="-10" x2="18" y2="-10" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="0" y1="10" x2="-16" y2="35" stroke="#1a1a2e" stroke-width="2"/>
    <line x1="0" y1="10" x2="16" y2="35" stroke="#1a1a2e" stroke-width="2"/>
    <text x="0" y="55" text-anchor="middle" font-size="13" font-weight="bold">Customer</text>
  </g>

  <!-- Use case ellipses -->
  <g font-size="12" fill="#0a2e3d">
    <ellipse cx="400" cy="130" rx="110" ry="28" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
    <text x="400" y="134" text-anchor="middle" font-weight="bold">Open Account</text>

    <ellipse cx="620" cy="130" rx="90" ry="28" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
    <text x="620" y="134" text-anchor="middle" font-weight="bold">View Details</text>

    <ellipse cx="400" cy="210" rx="90" ry="28" fill="#90e0ef" stroke="#0f7ba8" stroke-width="2"/>
    <text x="400" y="214" text-anchor="middle" font-weight="bold">Deposit</text>

    <ellipse cx="620" cy="210" rx="90" ry="28" fill="#90e0ef" stroke="#0f7ba8" stroke-width="2"/>
    <text x="620" y="214" text-anchor="middle" font-weight="bold">Withdraw</text>

    <ellipse cx="400" cy="290" rx="100" ry="28" fill="#90e0ef" stroke="#0f7ba8" stroke-width="2"/>
    <text x="400" y="294" text-anchor="middle" font-weight="bold">Transfer Funds</text>

    <ellipse cx="620" cy="290" rx="105" ry="28" fill="#90e0ef" stroke="#0f7ba8" stroke-width="2"/>
    <text x="620" y="294" text-anchor="middle" font-weight="bold">Apply Interest</text>

    <ellipse cx="400" cy="370" rx="110" ry="28" fill="#f4a261" stroke="#a35c1a" stroke-width="2"/>
    <text x="400" y="374" text-anchor="middle" font-weight="bold">View Mini Statement</text>

    <ellipse cx="620" cy="370" rx="105" ry="28" fill="#f4a261" stroke="#a35c1a" stroke-width="2"/>
    <text x="620" y="374" text-anchor="middle" font-weight="bold">Search by Name</text>

    <ellipse cx="400" cy="450" rx="100" ry="28" fill="#f4a261" stroke="#a35c1a" stroke-width="2"/>
    <text x="400" y="454" text-anchor="middle" font-weight="bold">Close Account</text>

    <ellipse cx="620" cy="450" rx="115" ry="28" fill="#f4a261" stroke="#a35c1a" stroke-width="2"/>
    <text x="620" y="454" text-anchor="middle" font-weight="bold">Export Bank Report</text>
  </g>

  <!-- Actor to use case lines -->
  <g stroke="#555" stroke-width="1.4">
    <line x1="70" y1="300" x2="290" y2="130"/>
    <line x1="70" y1="300" x2="310" y2="210"/>
    <line x1="70" y1="300" x2="300" y2="290"/>
    <line x1="70" y1="300" x2="300" y2="370"/>
    <line x1="70" y1="300" x2="300" y2="450"/>
    <line x1="70" y1="300" x2="530" y2="130"/>
    <line x1="70" y1="300" x2="530" y2="210"/>
  </g>

  <!-- extends -->
  <line x1="490" y1="130" x2="530" y2="130" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <line x1="500" y1="290" x2="515" y2="290" stroke="#888" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow2)"/>
  <text x="510" y="120" font-size="10" fill="#666">&lt;&lt;include&gt;&gt;</text>

  <text x="450" y="595" text-anchor="middle" font-size="11" fill="#666">
    Note: A single "Customer" actor represents the end user operating the console menu.
  </text>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#888"/>
    </marker>
  </defs>
</svg>
