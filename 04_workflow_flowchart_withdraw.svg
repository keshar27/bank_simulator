<svg viewBox="0 0 700 900" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="700" height="900" fill="#ffffff"/>
  <text x="350" y="35" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">
    Workflow Flowchart - Withdraw Operation
  </text>

  <!-- Start -->
  <ellipse cx="350" cy="75" rx="80" ry="28" fill="#4361ee" stroke="#2c3e91" stroke-width="2"/>
  <text x="350" y="80" text-anchor="middle" font-size="13" fill="white" font-weight="bold">Start</text>
  <line x1="350" y1="103" x2="350" y2="130" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Input -->
  <polygon points="270,130 430,130 410,175 290,175" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
  <text x="350" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">Input: account_no,</text>
  <text x="350" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">amount</text>
  <line x1="350" y1="175" x2="350" y2="205" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Decision 1: amount > 0 -->
  <polygon points="350,205 440,255 350,305 260,255" fill="#ffd166" stroke="#a87f00" stroke-width="2"/>
  <text x="350" y="250" text-anchor="middle" font-size="11" font-weight="bold">amount &gt; 0 ?</text>
  <text x="350" y="264" text-anchor="middle" font-size="10">and account active?</text>

  <text x="455" y="250" font-size="11" fill="#c0392b" font-weight="bold">No</text>
  <line x1="440" y1="255" x2="560" y2="255" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>
  <rect x="560" y="230" width="120" height="50" rx="6" fill="#f72585" stroke="#a4025c" stroke-width="2"/>
  <text x="620" y="252" text-anchor="middle" font-size="11" fill="white" font-weight="bold">Show Error:</text>
  <text x="620" y="267" text-anchor="middle" font-size="10" fill="white">Invalid input</text>

  <text x="360" y="325" font-size="11" fill="#2d6a4f" font-weight="bold">Yes</text>
  <line x1="350" y1="305" x2="350" y2="335" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Decision 2: amount <= MAX -->
  <polygon points="350,335 450,390 350,445 250,390" fill="#ffd166" stroke="#a87f00" stroke-width="2"/>
  <text x="350" y="385" text-anchor="middle" font-size="11" font-weight="bold">amount &lt;= 100,000 ?</text>
  <text x="350" y="399" text-anchor="middle" font-size="10">(max withdrawal limit)</text>

  <text x="465" y="385" font-size="11" fill="#c0392b" font-weight="bold">No</text>
  <line x1="450" y1="390" x2="620" y2="390" stroke="#333" stroke-width="2"/>
  <line x1="620" y1="390" x2="620" y2="280" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <text x="360" y="460" font-size="11" fill="#2d6a4f" font-weight="bold">Yes</text>
  <line x1="350" y1="445" x2="350" y2="475" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Decision 3: sufficient balance / min balance -->
  <polygon points="350,475 460,540 350,605 240,540" fill="#ffd166" stroke="#a87f00" stroke-width="2"/>
  <text x="350" y="530" text-anchor="middle" font-size="11" font-weight="bold">New balance &gt;= 0 AND</text>
  <text x="350" y="546" text-anchor="middle" font-size="11" font-weight="bold">meets min-balance rule?</text>
  <text x="350" y="562" text-anchor="middle" font-size="9">(savings min = $500)</text>

  <text x="475" y="535" font-size="11" fill="#c0392b" font-weight="bold">No</text>
  <line x1="460" y1="540" x2="620" y2="540" stroke="#333" stroke-width="2"/>
  <line x1="620" y1="540" x2="620" y2="280" stroke="#333" stroke-width="2"/>

  <text x="360" y="625" font-size="11" fill="#2d6a4f" font-weight="bold">Yes</text>
  <line x1="350" y1="605" x2="350" y2="635" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Process: deduct balance -->
  <rect x="250" y="635" width="200" height="50" rx="6" fill="#90e0ef" stroke="#0f7ba8" stroke-width="2"/>
  <text x="350" y="655" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">Deduct amount from</text>
  <text x="350" y="672" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">account balance</text>
  <line x1="350" y1="685" x2="350" y2="710" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Process: log transaction -->
  <rect x="250" y="710" width="200" height="50" rx="6" fill="#90e0ef" stroke="#0f7ba8" stroke-width="2"/>
  <text x="350" y="730" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">Log transaction to</text>
  <text x="350" y="747" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">transactions.csv</text>
  <line x1="350" y1="760" x2="350" y2="785" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- Output -->
  <polygon points="270,785 430,785 410,830 290,830" fill="#4cc9f0" stroke="#0f7ba8" stroke-width="2"/>
  <text x="350" y="812" text-anchor="middle" font-size="12" font-weight="bold" fill="#0a2e3d">Display new balance</text>
  <line x1="350" y1="830" x2="350" y2="850" stroke="#333" stroke-width="2" marker-end="url(#a4)"/>

  <!-- End -->
  <ellipse cx="350" cy="875" rx="80" ry="24" fill="#4361ee" stroke="#2c3e91" stroke-width="2"/>
  <text x="350" y="880" text-anchor="middle" font-size="13" fill="white" font-weight="bold">End</text>

  <!-- Error path merges back down to End via right side -->
  <line x1="620" y1="280" x2="620" y2="875" stroke="#333" stroke-width="0" />
  <path d="M 620 280 L 620 875 L 430 875" fill="none" stroke="#333" stroke-width="2" marker-end="url(#a4)" stroke-dasharray="0"/>

  <defs>
    <marker id="a4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#333"/>
    </marker>
  </defs>
</svg>
